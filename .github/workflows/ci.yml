name: CI

on:
  push:
    branches: [main, v3]
  pull_request:

jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - run: npx playwright install --with-deps chromium

      # Le serveur de test (playwright.config.ts) fait lui-même le build de production.
      - run: npm run test:e2e
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
